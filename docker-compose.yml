version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: dravio-postgres
    environment:
      POSTGRES_USER: dravio_user
      POSTGRES_PASSWORD: dravio_password
      POSTGRES_DB: dravio_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: dravio-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: dravio-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  metering-service:
    build:
      context: ./services/metering-service
      dockerfile: Dockerfile
    environment:
      - KAFKA_URL=kafka:9092
      - REDIS_URL=redis:6379
    depends_on:
      - kafka
      - redis

  fraud-discovery:
    build:
      context: ./services/fraud-discovery
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      - KAFKA_URL=kafka:9092
    depends_on:
      - kafka

  audit-service:
    build:
      context: ./services/audit-service
      dockerfile: Dockerfile
    environment:
      - KAFKA_URL=kafka:9092
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/dravio
    depends_on:
      - kafka
      - postgres

  analytics-service:
    build:
      context: ./services/analytics-service
      dockerfile: Dockerfile
    environment:
      - KAFKA_URL=kafka:9092
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/dravio
    depends_on:
      - kafka
      - postgres

  admin-portal:
    build:
      context: ./apps/admin-portal
      dockerfile: Dockerfile
    ports:
      - "3001:3000"
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/dravio
    depends_on:
      - postgres

  auth-service:
    build:
      context: ./services/auth-service
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/dravio
      - KAFKA_URL=kafka:9092
    depends_on:
      - postgres
      - kafka

  session-service:
    build:
      context: ./services/session-service
    ports:
      - "8085:3005"
    environment:
      - KAFKA_URL=kafka:9092
      - REDIS_URL=redis:6379
    depends_on:
      - kafka
      - redis

  payment-service:
    build:
      context: ./services/payment-service
    ports:
      - "3005:3005"
    environment:
      - KAFKA_URL=kafka:9092
    depends_on:
      - kafka

  marketplace-service:
    build:
      context: ./services/marketplace-service
    ports:
      - "3002:3000"
    environment:
      - KAFKA_URL=kafka:9092
      - REDIS_URL=redis:6379
    depends_on:
      - kafka
      - redis

  buyer-web:
    build:
      context: ./apps/buyer-web
    ports:
      - "8000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3000
    depends_on:
      - auth-service

  isp-service:
    build:
      context: ./services/isp-service
    ports:
      - "8080:8080"
    environment:
      - KAFKA_URL=kafka:9092
    depends_on:
      - kafka

  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: dravio-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  kafka-setup:
    image: confluentinc/cp-kafka:latest
    container_name: dravio-kafka-setup
    depends_on:
      - kafka
    command: >
      bash -c "echo 'Waiting for Kafka to be ready...' && \
      cub kafka-ready -b kafka:9092 1 30 && \
      kafka-topics --create --if-not-exists --zookeeper zookeeper:2181 --partitions 3 --replication-factor 1 --topic dm.auth.user_registered && \
      kafka-topics --create --if-not-exists --zookeeper zookeeper:2181 --partitions 3 --replication-factor 1 --topic dm.session.started && \
      kafka-topics --create --if-not-exists --zookeeper zookeeper:2181 --partitions 3 --replication-factor 1 --topic dm.session.completed && \
      kafka-topics --create --if-not-exists --zookeeper zookeeper:2181 --partitions 3 --replication-factor 1 --topic dm.payment.completed && \
      kafka-topics --create --if-not-exists --zookeeper zookeeper:2181 --partitions 3 --replication-factor 1 --topic dm.metering.update && \
      echo 'Kafka topics created successfully.'"

volumes:
  postgres_data:
  redis_data:
