version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: dravio-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dravio_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-dravio_production}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./master_init.sql:/docker-entrypoint-initdb.d/master_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dravio_user} -d ${POSTGRES_DB:-dravio_production}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: dravio-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: dravio-zookeeper
    restart: always
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD", "nc", "-vz", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  metering-service:
    build:
      context: .
      dockerfile: services/metering-service/Dockerfile
    environment:
      - KAFKA_URL=kafka:9092
      - REDIS_URL=redis:6379
    depends_on:
      - kafka
      - redis

  fraud-discovery:
    build:
      context: .
      dockerfile: services/fraud-discovery/Dockerfile
    ports:
      - "8082:8081"
    environment:
      - KAFKA_URL=kafka:9092
    depends_on:
      - kafka

  audit-service:
    build:
      context: .
      dockerfile: services/audit-service/Dockerfile
    environment:
      - KAFKA_URL=kafka:9092
      - DATABASE_URL=postgres://${POSTGRES_USER:-dravio_user}:${POSTGRES_PASSWORD:?err}@postgres:5432/${POSTGRES_DB:-dravio_production}
    depends_on:
      - kafka
      - postgres

  analytics-service:
    build:
      context: .
      dockerfile: services/analytics-service/Dockerfile
    environment:
      - KAFKA_URL=kafka:9092
      - DATABASE_URL=postgres://${POSTGRES_USER:-dravio_user}:${POSTGRES_PASSWORD:?err}@postgres:5432/${POSTGRES_DB:-dravio_production}
    depends_on:
      - kafka
      - postgres

  admin-portal:
    build:
      context: .
      dockerfile: apps/admin-portal/Dockerfile
    ports:
      - "3001:3000"
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-dravio_user}:${POSTGRES_PASSWORD:?err}@postgres:5432/${POSTGRES_DB:-dravio_production}
    depends_on:
      - postgres

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-dravio_user}:${POSTGRES_PASSWORD:?err}@postgres:5432/${POSTGRES_DB:-dravio_production}
      - KAFKA_URL=kafka:9092
      - USER_SERVICE_URL=http://user-service:3002
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      user-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "nc", "-vz", "localhost", "3000"]
      interval: 10s
      timeout: 5s
      retries: 3

  user-service:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    ports:
      - "3002:3002"
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-dravio_user}:${POSTGRES_PASSWORD:?err}@postgres:5432/${POSTGRES_DB:-dravio_production}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nc", "-vz", "localhost", "3002"]
      interval: 10s
      timeout: 5s
      retries: 3

  session-service:
    build:
      context: .
      dockerfile: services/session-service/Dockerfile
    ports:
      - "8085:3005"
    environment:
      - KAFKA_URL=kafka:9092
      - REDIS_URL=redis:6379
    depends_on:
      kafka:
        condition: service_started
      redis:
        condition: service_healthy

  payment-service:
    build:
      context: .
      dockerfile: services/payment-service/Dockerfile
    ports:
      - "3005:3005"
    environment:
      - PORT=3005
      - DATABASE_URL=postgres://${POSTGRES_USER:-dravio_user}:${POSTGRES_PASSWORD:?err}@postgres:5432/${POSTGRES_DB:-dravio_production}
      - KAFKA_URL=kafka:9092
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  marketplace-service:
    build:
      context: .
      dockerfile: services/marketplace-service/Dockerfile
    ports:
      - "3003:3000"
    environment:
      - KAFKA_URL=kafka:9092
      - REDIS_URL=redis:6379
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
    depends_on:
      kafka:
        condition: service_started
      redis:
        condition: service_healthy

  billing-service:
    build:
      context: .
      dockerfile: services/billing-service/Dockerfile
    ports:
      - "3006:3006"
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-dravio_user}:${POSTGRES_PASSWORD:?err}@postgres:5432/${POSTGRES_DB:-dravio_production}
      - KAFKA_URL=kafka:9092
      - PAYMENT_SERVICE_URL=http://payment-service:3005
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  admin-service:
    build:
      context: .
      dockerfile: services/admin-service/Dockerfile
    ports:
      - "3008:3008"
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-dravio_user}:${POSTGRES_PASSWORD:?err}@postgres:5432/${POSTGRES_DB:-dravio_production}
      - KAFKA_URL=kafka:9092
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started


  buyer-web:
    build:
      context: .
      dockerfile: apps/buyer-web/Dockerfile
    ports:
      - "8000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
    depends_on:
      - auth-service

  gateway-service:
    build:
      context: .
      dockerfile: services/gateway-service/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
    depends_on:
      - auth-service
      - user-service

  isp-service:
    build:
      context: .
      dockerfile: services/isp-service/Dockerfile
    ports:
      - "8083:8080"
    environment:
      - KAFKA_URL=kafka:9092
    depends_on:
      - kafka

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: dravio-kafka
    depends_on:
      - zookeeper
    ports:
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  kafka-setup:
    image: confluentinc/cp-kafka:7.5.0
    container_name: dravio-kafka-setup
    depends_on:
      - kafka
    command: >
      bash -c "echo 'Waiting for Kafka to be ready...' && \
      cub kafka-ready -b kafka:9092 1 30 && \
      kafka-topics --create --if-not-exists --bootstrap-server kafka:9092 --partitions 3 --replication-factor 1 --topic dm.auth.user_registered && \
      kafka-topics --create --if-not-exists --bootstrap-server kafka:9092 --partitions 3 --replication-factor 1 --topic dm.session.started && \
      kafka-topics --create --if-not-exists --bootstrap-server kafka:9092 --partitions 3 --replication-factor 1 --topic dm.session.completed && \
      kafka-topics --create --if-not-exists --bootstrap-server kafka:9092 --partitions 3 --replication-factor 1 --topic dm.payment.completed && \
      kafka-topics --create --if-not-exists --bootstrap-server kafka:9092 --partitions 3 --replication-factor 1 --topic dm.metering.update && \
      echo 'Kafka topics created successfully.'"

  mongodb:
    image: mongo:6.0
    container_name: dravio-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USERNAME:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}
    volumes:
      - mongodb_data:/data/db

  wireguard:
    image: lscr.io/linuxserver/wireguard:latest
    container_name: dravio-wireguard
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - SERVERURL=auto
      - SERVERPORT=51820
      - PEERS=1
      - PEERDNS=auto
      - INTERNAL_SUBNET=10.13.13.0
      - ALLOWEDIPS=0.0.0.0/0
      - LOG_CONFS=true
    ports:
      - "51820:51820/udp"
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv4.ip_forward=1
    restart: always

volumes:
  postgres_data:
  redis_data:
  mongodb_data:
