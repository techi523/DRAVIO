apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dravio-stack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/dravio/platform.git
    targetRevision: HEAD
    path: infra/k8s/charts/base-service
  destination:
    server: https://kubernetes.default.svc
    namespace: dravio-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
