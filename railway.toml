# ─────────────────────────────────────────────────────────────────────
# DRAVIO Platform — Railway Project Configuration (v3)
# Consolidated single backend service replacing 14 microservices.
# ─────────────────────────────────────────────────────────────────────

[build]
builder = "dockerfile"
dockerfilePath = "backend/Dockerfile"

[deploy]
startCommand = "node dist/index.js"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10

# ── Required Environment Variables ────────────────────────────────────
# Set ALL of these in Railway Dashboard → Service → Variables:
#
# DATABASE_URL          - Railway Postgres connection string
# REDIS_URL             - Upstash TLS URL: rediss://default:<pw>@<host>.upstash.io:6379
# KAFKA_URL             - Comma-separated broker URLs (optional)
# JWT_SECRET            - Generate with: openssl rand -base64 64
# FIREBASE_PROJECT_ID   - From Firebase Console → Project Settings
# FIREBASE_CLIENT_EMAIL - From Firebase service account JSON
# FIREBASE_PRIVATE_KEY  - From Firebase service account JSON
# CLOUDINARY_CLOUD_NAME - From Cloudinary Dashboard
# CLOUDINARY_API_KEY    - From Cloudinary Dashboard
# CLOUDINARY_API_SECRET - From Cloudinary Dashboard
# CORS_ORIGINS          - Comma-separated frontend domains
# STRIPE_SECRET_KEY     - sk_live_...
# STRIPE_WEBHOOK_SECRET - whsec_...
# MPESA_ENV             - production or sandbox
# MPESA_CONSUMER_KEY    - From Daraja API
# MPESA_CONSUMER_SECRET - From Daraja API
# MPESA_PASSKEY         - From Daraja API
# MPESA_SHORTCODE       - Your Daraja short code
# ISP_001_BASE_URL      - ISP provider base URL (dynamic: ISP_<ID>_BASE_URL)
# ISP_001_API_KEY       - ISP provider API key
# ISP_001_SECRET        - ISP webhook verification secret
# NODE_ENV              - production
