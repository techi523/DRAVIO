# DRAVIO Platform — Render Blueprint
# Single Web Service consuming all 14 microservices as internal modules.
# ─────────────────────────────────────────────────────────────────

services:

  - type: web
    name: dravio-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      # ── JWT (Required) ────────────────────────────────────────────
      - key: JWT_SECRET
        generateValue: true
      # ── Database ──────────────────────────────────────────────────
      - key: DATABASE_URL
        sync: false
      # ── Redis ────────────────────────────────────────────────────
      - key: REDIS_URL
        sync: false
      # ── Kafka ─────────────────────────────────────────────────────
      - key: KAFKA_URL
        sync: false
      # ── CORS ──────────────────────────────────────────────────────
      - key: CORS_ORIGINS
        value: https://buyer-web-henna.vercel.app,https://admin-portal-weld-seven.vercel.app
      # ── Payments ─────────────────────────────────────────────────
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: MPESA_ENV
        value: sandbox
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_PASSKEY
        sync: false
      - key: MPESA_SHORTCODE
        sync: false
      - key: USD_TO_KES_RATE
        value: "155.0"
        # ── ISP API (dynamic naming: ISP_<ID>_BASE_URL, ISP_<ID>_API_KEY, ISP_<ID>_SECRET) ──
      - key: ISP_001_BASE_URL
        sync: false
      - key: ISP_001_API_KEY
        sync: false
      - key: ISP_001_SECRET
        sync: false
      # ── FireAuth / Firebase ──────────────────────────────────────
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      # ── Cloudinary ──────────────────────────────────────────────
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # ── Apple OAuth ─────────────────────────────────────────────
      - key: APPLE_CLIENT_ID
        sync: false
      # ── Twilio OTP ──────────────────────────────────────────────
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_VERIFY_SERVICE_SID
        sync: false
      # ── OTEL ──────────────────────────────────────────────────────
      - key: OTEL_EXPORTER_OTLP_ENDPOINT
        sync: false
      - key: OTEL_SERVICE_NAME
        value: dravio-backend


# ─────────────────────────────────────────────────────────────────
# MANAGED DATABASES
# ─────────────────────────────────────────────────────────────────
databases:
  - name: dravio-postgres
    databaseName: dravio_production
    user: dravio_user
    plan: free
